<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALFRED</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e6e8ee;
    --muted: #8b8f9a;
    --accent: #5b8cff;
    --user-bubble: #5b8cff;
    --ai-bubble: #1f232c;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Start screen */
  #start-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 20px;
  }
  #start-screen h1 { font-size: 28px; margin: 0; }
  #start-screen p { color: var(--muted); margin: 0; text-align: center; max-width: 360px; }
  .model-choices { display: flex; gap: 16px; }
  .model-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 20px 28px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
    min-width: 180px;
    transition: border-color 0.15s;
  }
  .model-btn:hover { border-color: var(--accent); }
  .model-btn strong { display: block; margin-bottom: 6px; font-size: 16px; }
  .model-btn span { color: var(--muted); font-size: 13px; }
  #start-error { color: var(--error); font-size: 14px; min-height: 20px; }

  /* Chat view */
  #chat-view { display: none; flex: 1; flex-direction: column; height: 100vh; }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h2 { margin: 0; font-size: 16px; }
  header .badge {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 20px;
  }
  header button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 14px;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 14.5px;
  }
  .msg.user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.system .bubble { background: transparent; border: 1px dashed var(--error); color: var(--error); font-size: 13px; }

  #input-bar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  #input-bar textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14.5px;
    font-family: inherit;
    height: 48px;
  }
  #input-bar textarea:focus { outline: none; border-color: var(--accent); }
  #input-bar button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    cursor: pointer;
    font-size: 14.5px;
  }
  #input-bar button:disabled { opacity: 0.5; cursor: default; }

  .thinking { color: var(--muted); font-style: italic; font-size: 13.5px; padding: 0 20px 10px; }
</style>
</head>
<body>

<div id="start-screen">
  <h1>ALFRED</h1>
  <p>Choose a model to start this session. You can't switch mid-conversation — start a new chat to change models.</p>
  <div class="model-choices">
    <button class="model-btn" data-model="local">
      <strong>Local (Ollama)</strong>
      <span>Qwen 2.5 14B — runs on your machine, needs `ollama serve`.</span>
    </button>
    <button class="model-btn" data-model="openrouter">
      <strong>OpenRouter</strong>
      <span>poolside/laguna-s-2.1 — via OpenRouter API (free tier).</span>
    </button>
  </div>
  <div id="start-error"></div>
</div>

<div id="chat-view">
  <header>
    <h2>ALFRED</h2>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge" id="model-badge"></span>
      <button id="new-chat-btn">New chat</button>
    </div>
  </header>
  <div id="messages"></div>
  <div class="thinking" id="thinking" style="display:none;">ALFRED is thinking…</div>
  <div id="input-bar">
    <textarea id="input" placeholder="Ask ALFRED something…"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const startScreen = document.getElementById('start-screen');
const chatView = document.getElementById('chat-view');
const startError = document.getElementById('start-error');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const thinkingEl = document.getElementById('thinking');
const modelBadge = document.getElementById('model-badge');
const newChatBtn = document.getElementById('new-chat-btn');

function addMessage(role, content) {
  const row = document.createElement('div');
  row.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  inputEl.disabled = busy;
  thinkingEl.style.display = busy ? 'block' : 'none';
}

async function startSession(model) {
  startError.textContent = '';
  try {
    const res = await fetch('/session/new', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model }),
    });
    const data = await res.json();
    if (!res.ok) {
      startError.textContent = data.detail || 'Failed to start session.';
      return;
    }
    localStorage.setItem('alfred_thread_id', data.thread_id);
    localStorage.setItem('alfred_model', data.model);
    enterChat(data.thread_id, data.model);
  } catch (e) {
    startError.textContent = 'Could not reach ALFRED server.';
  }
}

function enterChat(threadId, model) {
  startScreen.style.display = 'none';
  chatView.style.display = 'flex';
  modelBadge.textContent = model === 'local' ? 'Local · Qwen 2.5 14B' : 'OpenRouter · poolside/laguna-s-2.1';
  messagesEl.innerHTML = '';
  inputEl.focus();
}

async function loadHistory(threadId) {
  try {
    const res = await fetch(`/history/${threadId}`);
    if (!res.ok) {
      resetToStart();
      return;
    }
    const data = await res.json();
    for (const m of data.messages) {
      addMessage(m.role, m.content);
    }
  } catch (e) {
    resetToStart();
  }
}

function resetToStart() {
  localStorage.removeItem('alfred_thread_id');
  localStorage.removeItem('alfred_model');
  chatView.style.display = 'none';
  startScreen.style.display = 'flex';
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  const threadId = localStorage.getItem('alfred_thread_id');
  addMessage('user', text);
  inputEl.value = '';
  setBusy(true);

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: threadId, message: text }),
    });
    const data = await res.json();
    if (!res.ok) {
      addMessage('system', data.detail || 'Something went wrong.');
    } else {
      addMessage('assistant', data.response);
      if (data.saved) {
        addMessage('system', 'Saved to research_output.txt');
      }
    }
  } catch (e) {
    addMessage('system', 'Could not reach ALFRED server.');
  } finally {
    setBusy(false);
    inputEl.focus();
  }
}

document.querySelectorAll('.model-btn').forEach(btn => {
  btn.addEventListener('click', () => startSession(btn.dataset.model));
});

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
newChatBtn.addEventListener('click', resetToStart);

// Resume existing session on load
const existingThread = localStorage.getItem('alfred_thread_id');
const existingModel = localStorage.getItem('alfred_model');
if (existingThread && existingModel) {
  enterChat(existingThread, existingModel);
  loadHistory(existingThread);
}
</script>

</body>
</html>
